name: CI and Deploy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          NODE_ENV: test
          SESSION_SECRET: test-session-secret
          FRONTEND_URL: http://localhost:5173
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://bookish-backend-41i1.onrender.com/api
        run: npm run build

  deploy-render-backend:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ujjwal-1'

    steps:
      - name: Validate backend deploy hook
        run: |
          if [[ -z "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}" ]]; then
            echo "Missing GitHub secret: RENDER_BACKEND_DEPLOY_HOOK_URL"
            echo "Create Render deploy hook for backend service and add it in repo secrets."
            exit 1
          fi

      - name: Trigger backend deploy
        run: curl --fail --show-error --silent -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

  deploy-render-frontend:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ujjwal-1'

    steps:
      - name: Validate frontend deploy hook
        run: |
          if [[ -z "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}" ]]; then
            echo "Missing GitHub secret: RENDER_FRONTEND_DEPLOY_HOOK_URL"
            echo "Create Render deploy hook for frontend service and add it in repo secrets."
            exit 1
          fi

      - name: Trigger frontend deploy
        run: curl --fail --show-error --silent -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
